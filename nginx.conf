# librasuite.com.ar no tiene /docs/ ni login, asi que no usa la imagen
# libra-nginx-web del kit: esa trae un `proxy_pass` al contenedor de auth, y nginx
# no arranca si el upstream no resuelve. Lo que queda es el `location /` publico
# de la plantilla del kit, igual.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # `$uri.html` sirve /legal/privacidad desde legal/privacidad.html.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # El Markdown del contrato se sirve como texto, para poder correrle sha256sum.
    location ~ ^/legal/.*\.md$ {
        default_type text/plain;
        charset utf-8;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
